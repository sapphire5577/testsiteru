<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liquid Garden — Droplet Physics Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.pill{padding:10px 16px;border:1px solid rgba(210,235,255,.24);border-radius:24px;color:#eef8ff;background:rgba(5,14,28,.35);backdrop-filter:blur(10px);font-size:16px}.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(230,245,255,.7);font-size:13px;white-space:nowrap}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">‹</div><div class="pill" id="time">1:00</div></div><div class="hint">タップでオイルが揺れる</div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR=1,last=performance.now(),elapsed=0;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const vessel={cx:()=>W/2,top:()=>H*.25,bot:()=>H*.75,rx:()=>Math.min(W*.32,180),ry:()=>Math.min(W*.19,150),neck:()=>Math.min(W*.075,34)};const drops=[];const colors=[{c:'#59c8ff',hi:'#dff8ff',glow:'#63d7ff'},{c:'#77e4d1',hi:'#effffb',glow:'#76ffe4'},{c:'#a98cff',hi:'#f0e7ff',glow:'#b79aff'}];function addDrop(x,y,r,ci=0,vy=0){drops.push({x,y,r,vy,ci,phase:Math.random()*6.28,life:0})}for(let i=0;i<13;i++)addDrop(W/2+(Math.random()-.5)*30,H*.29+Math.random()*H*.10,5+Math.random()*12,i%3,15+Math.random()*35);let pool=0,impact=0,touchX=W/2;function update(dt){elapsed+=dt;impact*=Math.pow(.001,dt);for(const d of drops){d.life+=dt;d.phase+=dt*2;d.vy+=58*dt;d.x+=Math.sin(d.phase)*.6*dt+(touchX-d.x)*.0002*impact;d.y+=d.vy*dt;const cx=vessel.cx(),neckY=(vessel.top()+vessel.bot())/2;if(d.y<neckY-14){const rx=vessel.rx(),ry=vessel.ry(),cy=vessel.top(),dx=(d.x-cx)/Math.max(1,rx-d.r),dy=(d.y-cy)/Math.max(1,ry-d.r);if(dx*dx+dy*dy>1){d.x=cx+dx/Math.hypot(dx,dy)*Math.max(1,rx-d.r);d.vy*=-.25}}if(d.y>=neckY-10&&d.y<neckY+10)d.x+=(cx-d.x)*.12;const floor=vessel.bot()+vessel.ry()*.72;if(d.y>floor){d.y=floor-(pool*1.4+d.r*.45);d.vy*=-.12;pool=Math.min(55,pool+dt*1.9);d.r=Math.min(d.r*1.006,18)}if(d.y>neckY+22&&d.y<floor-5)d.x+=(cx-d.x)*.008}if(Math.floor(elapsed*2)%3===0&&drops.length<18&&Math.random()<dt*1.8)addDrop(vessel.cx()+(Math.random()-.5)*4,(vessel.top()+vessel.bot())/2-14,5+Math.random()*8,Math.floor(Math.random()*3),25)}function glassPath(){const cx=vessel.cx(),t=vessel.top(),b=vessel.bot(),rx=vessel.rx(),ry=vessel.ry(),n=vessel.neck();ctx.beginPath();ctx.moveTo(cx,t-ry);ctx.bezierCurveTo(cx-rx*.72,t-ry,cx-rx,t-ry*.45,cx-rx,t);ctx.bezierCurveTo(cx-rx,t+ry*.62,cx-n,t+ry*.8,cx-n,(t+b)/2);ctx.bezierCurveTo(cx-n,b-ry*.8,cx-rx,b-ry*.62,cx-rx,b);ctx.bezierCurveTo(cx-rx,b+ry*.45,cx-rx*.72,b+ry,cx,b+ry);ctx.bezierCurveTo(cx+rx*.72,b+ry,cx+rx,b+ry*.45,cx+rx,b);ctx.bezierCurveTo(cx+rx,b-ry*.62,cx+n,b-ry*.8,cx+n,(t+b)/2);ctx.bezierCurveTo(cx+n,t+ry*.8,cx+rx,t+ry*.62,cx+rx,t);ctx.bezierCurveTo(cx+rx,t-ry*.45,cx+rx*.72,t-ry,cx,t-ry);ctx.closePath()}function drawBg(){const g=ctx.createRadialGradient(W/2,H*.45,10,W/2,H*.45,Math.max(W,H)*.75);g.addColorStop(0,'#0b2850');g.addColorStop(.55,'#06152c');g.addColorStop(1,'#010710');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<70;i++){const x=(i*83.7)%W,y=(i*137.2)%H,r=1+(i%3)*.45;ctx.fillStyle=i%5===0?'rgba(120,205,255,.7)':'rgba(245,250,255,.65)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}}function drawPool(){const cx=vessel.cx(),y=vessel.bot()+vessel.ry()*.63,rx=vessel.rx()*.86;const grad=ctx.createLinearGradient(cx-rx,y,cx+rx,y);grad.addColorStop(0,'rgba(60,180,255,.18)');grad.addColorStop(.45,'rgba(130,225,255,.40)');grad.addColorStop(1,'rgba(80,220,205,.18)');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,y,rx,Math.max(4,4+pool*.18),0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(190,245,255,.38)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(cx,y,rx,Math.max(3,3+pool*.12),0,0,Math.PI*2);ctx.stroke()}function drawDrop(d){const q=colors[d.ci%colors.length],r=d.r*(1+Math.sin(d.phase)*.025+impact*.035);ctx.save();ctx.shadowBlur=18;ctx.shadowColor=q.glow;const grad=ctx.createRadialGradient(d.x-r*.35,d.y-r*.4,r*.08,d.x,d.y,r*1.1);grad.addColorStop(0,q.hi);grad.addColorStop(.18,'rgba(220,250,255,.95)');grad.addColorStop(.52,q.c);grad.addColorStop(1,'rgba(35,105,190,.35)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(d.x,d.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(235,255,255,.58)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(d.x-r*.34,d.y-r*.36,Math.max(1.2,r*.17),0,Math.PI*2);ctx.fill();ctx.restore()}function draw(){drawBg();ctx.save();glassPath();ctx.fillStyle='rgba(180,220,255,.035)';ctx.fill();ctx.strokeStyle='rgba(210,238,255,.62)';ctx.lineWidth=2.2;ctx.stroke();const cx=vessel.cx();const hg=ctx.createLinearGradient(cx-70,0,cx+70,0);hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(.45,'rgba(255,255,255,.16)');hg.addColorStop(.52,'rgba(255,255,255,.035)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;glassPath();ctx.fill();drawPool();for(const d of drops)drawDrop(d);ctx.strokeStyle='rgba(220,245,255,.2)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cx,vessel.top()+vessel.ry()*.78);ctx.lineTo(cx,vessel.bot()-vessel.ry()*.78);ctx.stroke();ctx.restore()}function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();const left=Math.max(0,60-Math.floor(elapsed));document.getElementById('time').textContent=`0:${String(left).padStart(2,'0')}`;requestAnimationFrame(frame)}canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;impact=1.6;for(const d of drops){const dx=d.x-e.clientX,dy=d.y-e.clientY,dist=Math.hypot(dx,dy);if(dist<90){d.vy-=35*(1-dist/90);d.x+=dx*-0.08}}});requestAnimationFrame(frame);
</script></body></html>
